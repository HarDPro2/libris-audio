name: 🧹 Limpieza semanal de huérfanos

# Borra de R2 lo que quedó de libros que ya no existen en la base de datos:
# audio, texto, timings y portada. Nunca toca un libro vivo.
#
# Cada lunes a las 3:00 UTC (11:00 PM del domingo en Venezuela).
# También se dispara a mano desde GitHub → Actions → Run workflow.
#
# Secrets que necesita:
#   BACKEND_URL    https://libris-audio-backend-....run.app   (sin barra final)
#   CLEANUP_TOKEN  el mismo valor que la variable CLEANUP_TOKEN del servicio
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulación (solo informar, no borrar)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  clean-orphans:
    name: Limpiar huérfanos de R2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧹 Llamar al endpoint de limpieza
        id: cleanup
        env:
          BACKEND_URL:   ${{ secrets.BACKEND_URL }}
          CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
          DRY_RUN:       ${{ inputs.dry_run || 'false' }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CLEANUP_TOKEN" ]; then
            echo "::error::Faltan los secrets BACKEND_URL o CLEANUP_TOKEN"
            exit 1
          fi

          echo "Limpieza de huérfanos · $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Simulación: $DRY_RUN"
          # A QUE HOST se llama. El valor completo del secret lo enmascara
          # GitHub, pero el host solo es otra cadena y sí sale — y sin esto,
          # un BACKEND_URL que apunte a un servicio viejo da un error del
          # endpoint que parece del endpoint y no lo es. Pasó el 05-10-2026:
          # tres ejecuciones culpando a una variable que estaba bien puesta.
          echo "Host destino: $(printf '%s' "${BACKEND_URL%/}" \
            | sed -E 's#^https?://##; s#/.*##')"

          RESPUESTA=$(curl -s -w "\n%{http_code}" --max-time 600 \
            "${BACKEND_URL%/}/api/clean-orphans?token=${CLEANUP_TOKEN}&dry=${DRY_RUN}")

          ESTADO=$(echo "$RESPUESTA" | tail -1)
          CUERPO=$(echo "$RESPUESTA" | head -n -1)

          echo "HTTP $ESTADO"
          echo "$CUERPO"

          if [ "$ESTADO" != "200" ]; then
            echo "::error::La limpieza devolvió HTTP $ESTADO"
            exit 1
          fi

          python3 - "$CUERPO" <<'PY' >> $GITHUB_OUTPUT
          import json, sys
          d = json.loads(sys.argv[1])
          for k in ("libros_vivos", "prefijos", "huerfanos", "files_deleted", "megas"):
              print(f"{k}={d.get(k, 0)}")
          print(f"dry_run={str(d.get('dry_run', False)).lower()}")
          PY

      - name: 📊 Resumen
        if: always()
        run: |
          {
            echo "### 🧹 Limpieza semanal de huérfanos"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Fecha | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Estado | ${{ job.status }} |"
            echo "| Simulación | ${{ steps.cleanup.outputs.dry_run }} |"
            echo "| Libros vivos | ${{ steps.cleanup.outputs.libros_vivos }} |"
            echo "| Prefijos en el bucket | ${{ steps.cleanup.outputs.prefijos }} |"
            echo "| Huérfanos encontrados | ${{ steps.cleanup.outputs.huerfanos }} |"
            echo "| Archivos borrados | ${{ steps.cleanup.outputs.files_deleted }} |"
            echo "| MB liberados | ${{ steps.cleanup.outputs.megas }} |"
            echo ""
            echo "> Solo se borran prefijos de libros que ya no están en la base de datos."
            echo "> Si la lista de libros no se pudo leer entera, no se borra nada y esto falla."
          } >> $GITHUB_STEP_SUMMARY
