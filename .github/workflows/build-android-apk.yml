name: Build & Release Native Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'package.json'          # el versionName sale de aqui: un bump debe publicar release
      - '.github/workflows/build-android-apk.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Read version from package.json ───────────────────────
      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # ── 3. Setup Java 17 for Native Kotlin Build ─────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Cachea la distribución de Gradle y las dependencias: si el runner
          # ya la tiene, no vuelve a descargarla y el build deja de depender
          # de que services.gradle.org responda.
          cache: 'gradle'
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      # ── 4. Accept Android SDK licenses ───────────────────────────
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n601085b94cd77f0b54ff86406957099ebe79c4d6" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" \
            > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "Licenses written ✅"

      # ── 5. Grant Gradle wrapper execute permission ────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 5b. Montar la llave de firma desde los secrets ───────────
      # El keystore ya NO va en el repositorio. Viaja como secret en base64
      # y se escribe en el runner, que es efimero y se destruye al acabar.
      #
      # Si los secrets no estan puestos, el paso NO falla: avisa y sigue. El
      # APK saldra firmado de depuracion, servira para instalar desde cero y
      # NO servira para actualizar. Es preferible a un CI en rojo sin decir
      # por que.
      - name: Preparar llave de firma
        id: firma
        env:
          KEYSTORE_B64: ${{ secrets.LIBRIS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Sin LIBRIS_KEYSTORE_B64: el APK saldra firmado de depuracion y no servira para actualizar."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/libris-release.jks"
          echo "LIBRIS_KEYSTORE_FILE=$RUNNER_TEMP/libris-release.jks" >> $GITHUB_ENV
          echo "Llave montada ✅"

      # ── 6. Build debug APK ───────────────────────────────────────
      # Inyectamos versionName (de package.json) y versionCode (nº de run,
      # siempre creciente) para que la app conozca su propia versión y el
      # auto-actualizador pueda comparar contra el último release.
      - name: Build Native Debug APK
        working-directory: android
        env:
          # LIBRIS_KEYSTORE_FILE lo pone el paso anterior en GITHUB_ENV.
          LIBRIS_KEYSTORE_PASS: ${{ secrets.LIBRIS_KEYSTORE_PASS }}
          LIBRIS_KEY_ALIAS: ${{ secrets.LIBRIS_KEY_ALIAS }}
          LIBRIS_KEY_PASS: ${{ secrets.LIBRIS_KEY_PASS }}
        run: >-
          ./gradlew assembleDebug --no-daemon --stacktrace
          -PlibrisVersionName=${{ steps.version.outputs.VERSION }}
          -PlibrisVersionCode=${{ github.run_number }}

      # ── 7. Rename APK (nombre FIJO sin versión) ──────────────────
      # Así el enlace de descarga de la landing nunca se rompe entre versiones.
      - name: Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "release-output/libris-audio.apk"

      # ── 8. Publish GitHub Release ────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Libris Audio v${{ steps.version.outputs.VERSION }}"
          body: |
            Libris Audio v${{ steps.version.outputs.VERSION }}

            Mejoras y correcciones en esta versión. ¡Gracias por usar Libris Audio! 🎧
          files: release-output/libris-audio.apk
          draft: false
          prerelease: false
          make_latest: true

