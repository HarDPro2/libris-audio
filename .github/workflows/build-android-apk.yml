name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-android-apk.yml'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# ── CRITICAL: needed to create GitHub Releases ──────────────────
permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Read version from package.json ───────────────────────
      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # ── 3. Setup Node 22 ─────────────────────────────────────────
      # @capacitor/cli@8.x requires Node >= 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 4. Install dependencies ──────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 5. Build web app in Capacitor mode ───────────────────────
      - name: Build web app (Capacitor mode)
        run: npm run build:capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # API URL is not a secret — hardcode the Render backend
          VITE_API_URL: https://libris-backend-z5fr.onrender.com

      # ── 6. Sync Capacitor ────────────────────────────────────────
      - name: Sync Capacitor with Android project
        run: npx cap sync android

      # ── 7. Setup Java 17 ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 8. Accept Android SDK licenses (write hash files directly) ──
      # Writing the license hashes directly is faster and produces no noise in the log,
      # unlike `sdkmanager --licenses` which prints thousands of lines.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n601085b94cd77f0b54ff86406957099ebe79c4d6" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" \
            > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "Licenses written ✅"

      # ── 9. Grant Gradle wrapper execute permission ────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build debug APK ───────────────────────────────────────
      # Debug APK is fine for direct (non-Play Store) distribution
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 11. Rename APK ────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "release-output/libris-audio-v${{ steps.version.outputs.VERSION }}.apk"

      # ── 12. Publish GitHub Release ────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Libris Audio v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📱 Libris Audio v${{ steps.version.outputs.VERSION }}

            Convierte tus PDFs en audiolibros con voces neuronales de alta calidad.

            ### 📥 Cómo instalar en Android
            1. Descarga el archivo `.apk` de abajo
            2. Ve a **Ajustes → Seguridad** y activa **"Instalar apps de fuentes desconocidas"**
            3. Abre el `.apk` descargado e instala
            4. ¡Listo! 🎧

            > Requiere **Android 5.0 (API 22)** o superior
          files: release-output/libris-audio-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          make_latest: true
