name: Build & Release Native Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Read version from package.json ───────────────────────
      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # ── 3. Setup Java 17 for Native Kotlin Build ─────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Accept Android SDK licenses ───────────────────────────
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n601085b94cd77f0b54ff86406957099ebe79c4d6" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" \
            > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "Licenses written ✅"

      # ── 5. Grant Gradle wrapper execute permission ────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 6. Build debug APK ───────────────────────────────────────
      - name: Build Native Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 7. Rename APK ────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "release-output/libris-audio-v${{ steps.version.outputs.VERSION }}.apk"

      # ── 8. Publish GitHub Release ────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "Libris Audio v${{ steps.version.outputs.VERSION }} (Nativa Android)"
          body: |
            ## 📱 Libris Audio v${{ steps.version.outputs.VERSION }} (App 100% Nativa Android)

            App nativa escrita en **Kotlin + Jetpack Compose + AndroidX Media3 (ExoPlayer)**.

            ### 🚀 Mejoras en esta versión:
            - **Audio en segundo plano 100% ininterrumpido** gracias al Foreground Service nativo.
            - **Controles en pantalla de bloqueo** y barra de notificaciones.
            - **Velocidad de reproducción ajustable** (1.0x - 2.0x).
            - **Diseño oscuro fluido** con portadas de libros.

            ### 📥 Cómo instalar en Android
            1. Descarga el archivo `.apk` adjunto abajo.
            2. Activa **"Instalar de fuentes desconocidas"** en Ajustes de Android.
            3. Abre e instala el `.apk`.
          files: release-output/libris-audio-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          make_latest: true

