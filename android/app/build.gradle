apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// ─────────────────────────────────────────────────────────────────────────
// DE DONDE SALE LA LLAVE DE FIRMA. Ver el comentario en signingConfigs.
// Orden: variable de entorno (el CI) → archivo .properties (tu maquina).
// ─────────────────────────────────────────────────────────────────────────
def firmaProps = new Properties()
def firmaArchivo = file(System.getenv("LIBRIS_KEYSTORE_PROPS")
        ?: "${rootDir}/keystore.properties")
if (firmaArchivo.exists()) {
    firmaArchivo.withInputStream { firmaProps.load(it) }
}

def firmaRuta        = System.getenv("LIBRIS_KEYSTORE_FILE") ?: firmaProps.getProperty("storeFile")
def firmaClaveAlmacen = System.getenv("LIBRIS_KEYSTORE_PASS") ?: firmaProps.getProperty("storePassword")
def firmaAlias       = System.getenv("LIBRIS_KEY_ALIAS")     ?: firmaProps.getProperty("keyAlias")
def firmaClaveAlias  = System.getenv("LIBRIS_KEY_PASS")      ?: firmaProps.getProperty("keyPassword")

def firmaLista = firmaRuta && firmaClaveAlmacen && firmaAlias && firmaClaveAlias \
        && file(firmaRuta).exists()

// ─────────────────────────────────────────────────────────────────────────
// EL AVISO DICE QUE FALTA, NO SOLO QUE NO HAY. 15-09-2026.
//
// La primera version decia «sin llave de firma» y se callaba el resto, y
// eso obligo a adivinar entre cuatro causas -archivo que no existe, ruta con
// barras invertidas, contrasena vacia, variable de entorno que no llega-.
// Un aviso que no dice que miro no sirve de nada.
//
// El BOM es el sospechoso numero uno: `Set-Content -Encoding UTF8` en
// PowerShell 5 escribe tres bytes invisibles al principio del archivo, y
// Properties.load() de Java los pega a la PRIMERA clave. `storeFile` pasa a
// llamarse «\uFEFFstoreFile» y devuelve null, con el archivo viendose
// perfecto en cualquier editor.
// ─────────────────────────────────────────────────────────────────────────
if (!firmaLista) {
    def faltan = []
    if (!firmaRuta)          faltan << "storeFile"
    if (!firmaClaveAlmacen)  faltan << "storePassword"
    if (!firmaAlias)         faltan << "keyAlias"
    if (!firmaClaveAlias)    faltan << "keyPassword"

    logger.lifecycle("")
    logger.lifecycle("[Libris] SIN LLAVE DE FIRMA. El APK saldra firmado de "
            + "depuracion y NO servira para actualizar instalaciones existentes.")
    logger.lifecycle("[Libris]   archivo buscado: ${firmaArchivo}")
    logger.lifecycle("[Libris]   existe:          ${firmaArchivo.exists()}")
    if (firmaArchivo.exists()) {
        logger.lifecycle("[Libris]   claves leidas:   ${firmaProps.stringPropertyNames().sort()}")
    }
    if (faltan) {
        logger.lifecycle("[Libris]   FALTAN:          ${faltan.join(', ')}")
        if (firmaArchivo.exists() && faltan.contains("storeFile")) {
            logger.lifecycle("[Libris]   Si arriba ves algo como «?storeFile», el archivo")
            logger.lifecycle("[Libris]   tiene un BOM al principio. Reescribelo sin BOM.")
        }
    } else if (firmaRuta) {
        logger.lifecycle("[Libris]   El .properties esta completo, pero el keystore NO esta en:")
        logger.lifecycle("[Libris]   ${firmaRuta}")
        logger.lifecycle("[Libris]   Usa barras normales: E:/carpeta/llave.jks")
    }
    logger.lifecycle("")
}

android {
    namespace "com.librisaudio.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.librisaudio.app"
        minSdk 24
        targetSdk 34
        // Versionado: el CI inyecta -PlibrisVersionName (de package.json) y
        // -PlibrisVersionCode (nº de run). En builds locales usa el fallback.
        versionCode (project.hasProperty('librisVersionCode') ? project.property('librisVersionCode').toString().toInteger() : 1)
        versionName (project.hasProperty('librisVersionName') ? project.property('librisVersionName').toString() : "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        // Include x86/x86_64 so the APK runs on emulators (BlueStacks, AVD)
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
    }

    signingConfigs {
        // ─────────────────────────────────────────────────────────────────
        // LA CLAVE NO VIVE AQUI. 14-09-2026.
        //
        // Hasta hoy el keystore iba versionado en el repositorio y la
        // contrasena estaba escrita tres lineas mas abajo, en claro. El
        // repositorio era publico. Con esas dos cosas, cualquiera podia
        // firmar un APK que Android acepta como actualizacion legitima de
        // esta app: se instala encima de la real y hereda sus datos y sus
        // permisos. No es un secreto que se pueda «desactivar»; la unica
        // salida fue retirar la llave y generar otra.
        //
        // Ahora la ruta y las contrasenas vienen de FUERA del arbol:
        //   1. variables de entorno  → es lo que usa el CI, con secrets
        //   2. un archivo .properties → es lo que usas tu en local
        //
        // El archivo se busca donde diga LIBRIS_KEYSTORE_PROPS, y si no,
        // en android/keystore.properties, que esta en .gitignore. Ponlo
        // fuera del repositorio si puedes: un despiste en el .gitignore no
        // puede filtrar lo que no esta dentro.
        //
        // Y si no hay nada configurado, el build NO falla: sale firmado de
        // depuracion. Asi un clon limpio compila sin pedirle la llave a
        // nadie; lo que no hace es publicar.
        // ─────────────────────────────────────────────────────────────────
        release {
            if (firmaLista) {
                storeFile file(firmaRuta)
                storePassword firmaClaveAlmacen
                keyAlias firmaAlias
                keyPassword firmaClaveAlias
            }
        }
    }

    buildTypes {
        debug {
            // El CI compila assembleDebug, asi que tambien va con la clave
            // estable: sin eso, cada build usaria un debug keystore distinto
            // y las actualizaciones fallarian con «conflicto con un paquete
            // existente». Si no hay llave configurada, cae al debug de
            // siempre y el APK simplemente no sirve para actualizar.
            signingConfig firmaLista ? signingConfigs.release : signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig firmaLista ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true   // expone BuildConfig.VERSION_NAME al auto-actualizador
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.browser:browser:1.8.0'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Media3 / ExoPlayer (Audio engine)
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'

    // Networking (Retrofit + OkHttp + Gson)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Appwrite Android SDK (handles OAuth session cookie automatically)
    implementation 'io.appwrite:sdk-for-android:6.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

